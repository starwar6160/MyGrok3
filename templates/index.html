<!DOCTYPE html>
<html lang="en" x-data="chatApp()" x-init="init()" :style="`font-size: ${fontSize}px !important;`">
<!-- 字体大小响应式绑定在 html -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Grok 多会话</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
  <style>
    .pre-code-box {
      background: #f9f9fb;
      border: 1px solid #e0e0e0;
      border-radius: 7px;
      padding: 12px 14px 12px 18px;
      margin: 8px 0;
      font-family: inherit;
      font-size: inherit;
      word-break: break-word;
      white-space: pre-wrap;
      position: relative;
      min-width: 0;
      box-sizing: border-box;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .pre-code-box .ai-label {
      color: #007bff;
      font-weight: bold;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .pre-code-box .ai-content {
      flex: 1;
      min-width: 0;
      display: block;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .pre-code-box .copy-btn {
      background: #f0f0f0;
      border: none;
      border-radius: 4px;
      padding: 2px 7px;
      margin-left: 8px;
      cursor: pointer;
      font-size: 1em;
      color: #666;
      transition: background .2s;
    }
    .pre-code-box .copy-btn:hover {
      background: #e0e0e0;
      color: #222;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      min-width: 0;
      min-height: 0;
      overflow-x: hidden;
      transition: font-size 0.2s;
    }

    .sidebar {
      width: 200px;
      background: #f4f4f9;
      padding: 10px;
      box-sizing: border-box;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar button {
      width: 100%;
      margin-bottom: 8px;
      box-sizing: border-box;
      word-break: break-all;
      font-size: inherit;
    }
    .sidebar .list button.active {
      background: #007bff;
      color: #fff;
    }
    .main {
      flex: 1;
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      min-width: 0;
      font-size: inherit;
      height: 100%;
      position: relative;
    }
    .chat {
      flex: 1 1 auto;
      overflow-y: auto;
      margin-bottom: 100px;
      white-space: pre-wrap;
      background: #fff;
      padding: 10px;
      border: 1px solid #ccc;
      min-width: 0;
      word-break: break-word;
      font-size: inherit;
      max-height: calc(100vh - 180px);
    }
    .form-fixed-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: #f8f8fa;
      border-top: 1px solid #eee;
      padding: 10px 0 0 0;
      z-index: 10;
    }
    .form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: stretch;
      font-size: inherit;
      background: none;
    }
    .form textarea {
      flex: 1 1 100px;
      min-width: 0;
      height: 60px;
      resize: vertical;
      box-sizing: border-box;
      font-size: inherit;
    }
    .form .model-group {
      display: flex;
      flex-direction: row;
      gap: 6px;
      align-items: stretch;
      font-size: inherit;
    }
    .form select.model-select {
      width: 90px;
      min-width: 70px;
      height: 44px;
      font-size: inherit;
      padding: 4px 6px;
    }
    .form button.send-btn {
      width: 60px;
      min-width: 50px;
      height: 44px;
      font-size: inherit;
      padding: 4px 0;
      border-radius: 6px;
    }
    .form select.font-size-select {
      width: 110px;
      min-width: 70px;
      height: 44px;
      font-size: inherit;
      margin-left: 6px;
    }
    .action-btns button {
      width: 44px;
      height: 44px;
      min-width: 36px;
      min-height: 36px;
      border-radius: 8px;
      font-size: inherit;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      margin-right: 0;
    }
    @media (max-width: 600px) {
      body {
        flex-direction: column;
        height: auto;
        font-size: inherit;
        font-size: 19px;
      }
      .sidebar {
        width: 100%;
        min-width: 0;
        padding: 8px 4px;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        overflow-x: auto;
        overflow-y: visible;
        border-bottom: 1px solid #ddd;
      }
      .sidebar button {
        width: auto;
        min-width: 80px;
        margin-right: 6px;
        margin-bottom: 0;
        font-size: 17px;
        padding: 8px 10px;
      }
      .sidebar .list {
        display: flex;
        flex-direction: row;
        gap: 4px;
        flex-wrap: wrap;
      }
      .main {
        width: 100%;
        padding: 8px 4px;
        min-width: 0;
      }
      .form {
        flex-direction: column;
        gap: 6px;
      }
      .form textarea {
        width: 100%;
        min-width: 0;
        font-size: 18px;
      }
      .form .model-group {
        flex-direction: row;
        gap: 6px;
      }
      .form select.model-select, .form button.send-btn, .form select.font-size-select {
        width: 100%;
        min-width: 0;
        font-size: 18px;
        height: 48px;
      }
      .chat {
        padding: 8px 4px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body :style="`font-size: ${fontSize}px`">
  <div class="sidebar">
    <button @click="addConversation()">＋ 新会话</button>
    <a href="/translation/" style="display: block; text-align: center; margin-bottom: 8px; padding: 8px; background: #4a6fa5; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">翻译工具</a>
    <div class="list">
      <template x-for="conv in conversations" :key="conv.id">
        <button
          :class="{ active: conv.id === currentId }"
          @click="selectConversation(conv.id)"
          x-text="conv.name">
        </button>
      </template>
    </div>
  </div>

  <div class="main">
    <div class="chat">
      <template x-for="msg in getCurrentConversation().messages" :key="msg.timestamp">
  <template x-if="msg.role === 'user'">
    <p class="user" x-text="'Q: ' + msg.content"></p>
  </template>
  <template x-if="msg.role === 'assistant'">
    <div class="pre-code-box">
      <span class="ai-label">A:</span>
      <span class="ai-content" x-text="msg.content"></span>
      <button class="copy-btn" @click="$clipboard(msg.content)" title="复制">📋</button>
    </div>
  </template>
</template>
    </div>
    <div class="form-fixed-bottom">
      <div class="form">
        <textarea x-model="question" placeholder="输入你的问题…"></textarea>
        <div class="model-group">
          <select x-model="model" class="model-select">
            <option value="grok-3">Grok 3</option>
            <option value="grok-3-mini">Grok 3 Mini</option>
          </select>
          <button class="send-btn" @click="send()">发送</button>
        </div>
        <select class="font-size-select" x-model="fontSize">
          <option value="18">小</option>
          <option value="20">标准</option>
          <option value="22">大</option>
          <option value="24">特大</option>
          <option value="28">超大</option>
          <option value="32">极大</option>
          <option value="36">最大</option>
        </select>
        <div class="action-btns">
          <button @click="copyConversation()" type="button" title="复制会话">📋</button>
          <button @click="showDeleteConfirm = true" type="button" title="删除会话">🗑️</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function chatApp() {
      return {
        conversations: [],
        currentId: null,
        question: '',
        model: window.appConfig && window.appConfig.selectedModel ? window.appConfig.selectedModel : 'grok-3-mini',
        fontSize: localStorage.getItem('fontSize') || '22',
        showDeleteConfirm: false,

        init() {
          this.conversations = JSON.parse(localStorage.getItem('chats')||'[]');
          if (!this.conversations.length) this.addConversation();
          this.currentId = this.conversations[0].id;
        },
        save() {
          localStorage.setItem('chats', JSON.stringify(this.conversations));
        },
        addConversation() {
      const id = Date.now();
      // 每次新会话都强制用后端注入的 DEFAULT_MODEL
      const defaultModel = window.appConfig && window.appConfig.selectedModel ? window.appConfig.selectedModel : 'grok-3-mini';
      this.model = defaultModel;
      this.conversations.unshift({
        id,
        name: `会话 ${this.conversations.length+1}`,
        messages: [],
        selectedModel: defaultModel
      });
      this.currentId = id;
      this.save();
    },
        selectConversation(id) {
          this.currentId = id;
        },
        getCurrentConversation() {
          return this.conversations.find(c=>c.id===this.currentId) || { messages: [] };
        },
        async send() {
          if (!this.question.trim()) return;
          const q = this.question;
          const conv = this.getCurrentConversation();
          conv.messages.push({ role: 'user', content: q, timestamp: Date.now() });
          this.question = '';
          this.save();

          const history = conv.messages.map(m => ({ role: m.role, content: m.content }));

          const resp = await fetch('/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: q, model: this.model, history })
          });
          if (!resp.body) return;

          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let done = false, chunk;
          while (!done) {
            const res = await reader.read();
            done = res.done;
            if (res.value) {
              chunk = decoder.decode(res.value, { stream: true });
              const conv = this.getCurrentConversation();
              const last = conv.messages[conv.messages.length - 1];
              if (!last || last.role !== 'assistant') {
                conv.messages.push({ role: 'assistant', content: chunk, timestamp: Date.now() });
              } else {
                last.content += chunk;
              }
              this.save();
            }
          }
        },
        fallbackCopy(text) {
          const el = document.createElement('textarea');
          el.value = text;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
        },
        copyConversation() {
          const conv = this.getCurrentConversation();
          const text = conv.messages.map(msg => (msg.role==='user'? 'Q: ':'A: ') + msg.content).join('\n\n');
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
              .then(() => alert('会话内容已复制'))
              .catch(() => this.fallbackCopy(text));
          } else {
            this.fallbackCopy(text);
            alert('会话内容已复制');
          }
        },
        deleteConversation() {
          const convIndex = this.conversations.findIndex(c=>c.id===this.currentId);
          if (convIndex !== -1) {
            this.conversations.splice(convIndex, 1);
            if (this.conversations.length) {
              this.currentId = this.conversations[0].id;
            } else {
              this.addConversation();
            }
            this.save();
          }
          this.showDeleteConfirm = false;
        }
      }
    }
    // 字体大小自动保存
    // Alpine 3.x 支持x-effect
    // 在html模板中加上：
    // <div x-effect="localStorage.setItem('fontSize', fontSize)"></div>
  </script>
<!-- 字体大小变动时自动保存 -->
<div x-effect="localStorage.setItem('fontSize', fontSize)"></div>

<!-- 自定义删除确认弹窗 -->
<div x-show="showDeleteConfirm" style="position:fixed;z-index:9999;left:0;top:0;width:100vw;height:100vh;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;" x-transition>
  <div style="background:#fff;padding:24px 20px;border-radius:12px;box-shadow:0 2px 16px #0003;min-width:220px;text-align:center;">
    <div style="margin-bottom:18px;font-size:1.1em;">确定要删除当前会话吗？</div>
    <button @click="deleteConversation()" style="margin:0 10px 0 0;padding:8px 18px;background:#d9534f;color:#fff;border:none;border-radius:6px;font-size:inherit;">确定</button>
    <button @click="showDeleteConfirm = false" style="padding:8px 18px;background:#eee;color:#333;border:none;border-radius:6px;font-size:inherit;">取消</button>
  </div>
</div>
</body>
</html>
